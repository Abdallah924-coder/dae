<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Suivi de commande — DAE Crypto</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{brand:'#176b57',ink:'#17211f'}}}}</script></head>
<body class="min-h-screen bg-slate-50 text-ink antialiased">
  <header class="border-b border-slate-100 bg-white"><nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4"><a href="/" class="text-xl font-black">DAE <span class="text-brand">Crypto</span></a><a href="/contact" class="hidden text-sm font-semibold text-brand md:block">Besoin d’aide ?</a><button data-menu-toggle aria-controls="mobile-menu" aria-expanded="false" aria-label="Ouvrir le menu" class="rounded-lg border border-slate-200 p-2 md:hidden"><svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></nav><div id="mobile-menu" class="hidden border-t border-slate-100 bg-white px-5 py-4 md:hidden"><div class="mx-auto grid max-w-7xl gap-3 text-sm font-semibold"><a href="/">Accueil</a><a href="/acheter">Acheter</a><a href="/vendre">Vendre</a><a href="/suivi">Suivre ma commande</a><a href="/contact">Contact</a></div></div></header>
  <main class="mx-auto max-w-4xl px-4 py-10 md:px-8 md:py-16">
    <a href="/" class="text-sm text-slate-500 hover:text-brand">← Accueil</a>
    <section class="mt-6 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm md:p-9">
      <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-emerald-50 text-2xl text-brand" aria-hidden="true">↻</div>
      <p class="mt-5 text-sm font-bold uppercase tracking-widest text-brand">Suivi de commande</p>
      <h1 id="pending-title" class="mt-2 text-3xl font-black">Votre commande</h1>
      <p id="pending-status" class="mt-2 text-slate-600" aria-live="polite">Chargement…</p>
      <p id="email-notice" class="mt-3 hidden rounded-xl bg-amber-50 p-3 text-sm text-amber-800" role="status"></p>
      <div id="order-details" class="mt-6 hidden rounded-2xl bg-slate-50 p-5"></div>
      <div id="reference-form-wrap" class="mt-7 hidden">
        <label for="reference-input" class="block text-sm font-semibold">Référence de commande</label>
        <form id="reference-form" class="mt-2 flex gap-2"><input id="reference-input" required placeholder="CMD-…" class="min-w-0 flex-1 rounded-xl border border-slate-200 px-4 py-3"><button class="rounded-xl bg-brand px-5 py-3 font-semibold text-white">Suivre</button></form>
      </div>
      <p id="pending-error" class="mt-4 hidden rounded-xl bg-rose-50 p-3 text-sm text-rose-700" role="alert"></p>
      <p class="mt-7 text-xs text-slate-500">Gardez votre référence. L’équipe examine la preuve avant de finaliser l’opération.</p>
    </section>
    <div class="mt-5 flex justify-between text-sm"><a href="/acheter" class="font-semibold text-brand">Nouvel achat</a><a href="/vendre" class="font-semibold text-brand">Nouvelle vente</a></div>
  </main>
  <script src="/js/app.js"></script><script src="/js/pending.js"></script>
</body>
</html>
